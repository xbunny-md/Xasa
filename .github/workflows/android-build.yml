name: Android Release Build (ODYX Flutter)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Override API_BASE_URL (e.g. https://your-odyx-app.vercel.app)"
        required: false
        type: string

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_android:
    name: Analyze, Test & Build Android APK + AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter static analyzer
        run: flutter analyze

      - name: Run Flutter unit and widget tests
        run: flutter test

      - name: Resolve and validate API_BASE_URL
        id: api_env
        shell: bash
        env:
          INPUT_URL: ${{ github.event.inputs.api_base_url }}
          VAR_URL: ${{ vars.API_BASE_URL }}
          SECRET_URL: ${{ secrets.API_BASE_URL }}
        run: |
          API_URL="${INPUT_URL:-${VAR_URL:-$SECRET_URL}}"
          if [ -z "$API_URL" ]; then
            echo "::error::API_BASE_URL is not configured. Set Repository Variable 'API_BASE_URL' (e.g. https://your-project.vercel.app) or pass it in workflow_dispatch inputs."
            exit 1
          fi
          if [[ ! "$API_URL" =~ ^https?:// ]]; then
            echo "::error::API_BASE_URL must start with https:// or http:// (got '$API_URL')."
            exit 1
          fi
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "Resolved API_BASE_URL successfully."

      - name: Decode optional google-services.json
        if: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          echo "Restored android/app/google-services.json"

      - name: Configure Android release signing keystore (optional)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat <<EOF > android/key.properties
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=upload-keystore.jks
          EOF
          echo "Configured release signing key.properties"

      - name: Build Android Release APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL="${{ steps.api_env.outputs.api_url }}"

      - name: Build Android App Bundle (AAB)
        run: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL="${{ steps.api_env.outputs.api_url }}"

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: odyx-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: odyx-release-aab
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            flutter_app/build/app/outputs/flutter-apk/app-release.apk
            flutter_app/build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true
